<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoiana</title>
    <!-- import favicon -->
    <link rel="icon" href="./assets/images/favicon.svg" />
    <!-- meta -->
    <meta property="og:url" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <!-- meta -->
    <link rel="stylesheet" href="./assets/fonts/Boska/font.css" />
    <link rel="stylesheet" href="./assets/fonts/Montserrat/font.css" />
    <link rel="stylesheet" href="./assets/libs/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/libs/lenis.css" />

    <link rel="stylesheet" href="./assets/main/css/style.min.css" />
    <!-- end link custom css page -->
    <!-- scrollRestoration -->
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
    </script>

  <body>
    <!-- login -->
    <script>
      fetch("./components/login.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("login-screen").innerHTML = data;
        });
    </script>

    <div id="login-screen"></div>
    <!-- layout -->
    <!-- header -->
    <script>
      fetch("./components/header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
          const currentPath = window.location.pathname || "/";

          const navLinks = document.querySelectorAll(".header-menu ul>li>a");
          navLinks.forEach((link) => {
            const linkPath = link.getAttribute("href");

            // Normalize paths for comparison
            let normalizedCurrentPath = currentPath;
            let normalizedLinkPath = linkPath;

            // Remove leading "./" from link path
            if (normalizedLinkPath.startsWith("./")) {
              normalizedLinkPath = normalizedLinkPath.substring(1);
            }

            // Get the last segment of the path
            const currentSegment = normalizedCurrentPath.split("/").pop() || "";
            const linkSegment = normalizedLinkPath.split("/").pop() || "";

            // Check if current path is root or ends with /
            const isRootPath =
              currentPath === "/" ||
              currentPath.endsWith("/") ||
              currentSegment === "";

            // Check if link is home/index
            const isHomeLink =
              linkPath === "/" ||
              linkPath === "./" ||
              linkPath === "./index.html" ||
              linkPath === "index.html" ||
              linkSegment === "index.html";

            // Match logic
            const isMatch =
              normalizedLinkPath === normalizedCurrentPath || // Exact match
              currentSegment === linkSegment || // Segment match
              (isRootPath && isHomeLink) || // Root path matches home link
              (currentPath.endsWith(normalizedLinkPath) &&
                normalizedLinkPath !== "/");

            if (isMatch) {
              link.classList.add("active");
            }
          });
        });
    </script>
    <header id="header" class="header position-fixed"></header>
    <!-- end header -->
    <main>
      <section class="banner-intro">
        <video
          class="banner-intro-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
        >
          <source src="./assets/videos/banner-intro.mp4" type="video/mp4" />
        </video>
        <h2 class="banner-intro-title" data-banner-intro-title>
          Oceanside living. <br />
          World-class everything.
        </h2>
      </section>
      <div class="index-login-modal" data-index-login-modal>
        <div class="index-login-modal__overlay" data-index-login-close></div>
        <div
          class="index-login-modal__dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="index-login-title"
        >
          <button
            class="index-login-modal__close"
            type="button"
            aria-label="Close login popup"
            data-index-login-close
          ></button>
          <div class="index-login-modal__title" id="index-login-title">
            Welcome back
          </div>
          <form class="index-login-modal__form">
            <div class="field-item">
              <label for="index-login-username">Username</label>
              <input
                type="text"
                id="index-login-username"
                name="username"
                placeholder="Enter your username"
              />
            </div>
            <div class="field-item">
              <label for="index-login-password">Password</label>
              <input
                type="password"
                id="index-login-password"
                name="password"
                placeholder="Enter your password"
              />
            </div>
            <button class="btn-submit" type="submit">Login</button>
          </form>
          <div class="index-login-modal__signup">
            <span>Don't have an account?</span>
            <a href="./register.html">Sign up</a>
          </div>
          <button
            class="index-login-modal__skip"
            type="button"
            data-index-login-close
          >
            Skip
          </button>
        </div>
      </div>
    </main>
    <!-- layout -->
    <!-- footer -->
    <script>
      fetch("./components/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>

    <footer id="footer"></footer>
    <!-- end footer -->
    <!-- end layout -->

    <script src="./assets/libs/jquery-3.7.1.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>
    <script src="./assets/libs/SplitText.min.js"></script>
    <script src="./assets/libs/bootstrap.bundle.min.js"></script>
    <script src="./assets/libs/swiper-bundle.min.js"></script>
    <script src="./assets/libs/moment.min.js"></script>
    <script src="./assets/libs/lightpick.min.js"></script>
    <!-- import custom js -->
    <script type="module" src="./assets/main/js/script.min.js"></script>
    <!-- <script type="module" src="./assets/main/js/home.min.js"></script> -->

    <!-- end import custom js -->
  </body>
