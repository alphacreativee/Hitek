<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoiana - Gallery</title>
    <!-- import favicon -->
    <link rel="icon" href="./assets/images/favicon.svg" />
    <!-- meta -->
    <meta property="og:url" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <!-- meta -->
    <link rel="stylesheet" href="./assets/fonts/Boska/font.css" />
    <link rel="stylesheet" href="./assets/fonts/Montserrat/font.css" />
    <link rel="stylesheet" href="./assets/libs/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/libs/lenis.css" />
    <link rel="stylesheet" href="./assets/libs/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./assets/libs/lightpick.min.css" />
    <link rel="stylesheet" href="./assets/libs/glightbox.min.css" />
    <!-- end meta -->
    <!-- link custom css page -->
    <link rel="stylesheet" href="./assets/main/css/style.min.css" />
    <!-- end link custom css page -->
    <!-- scrollRestoration -->
    <script>
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }
    </script>
</head>

<body>
    <!-- login -->
    <script>
        fetch("./components/login.html")
            .then((response) => response.text())
            .then((data) => {
                document.getElementById("login-screen").innerHTML = data;
            });
    </script>

    <div id="login-screen"></div>
    <!-- layout -->
    <!-- header -->
    <div class="login section-login register">
        <div class="login-inner">
            <div class="login-wrapper" id="register">
                <div class="box-login">
                    <div class="title">Create account</div>
                    <div class="sub">Join Hoiana Beach Villas</div>
                    <div class="box-form">

                        <div class="form-row">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" placeholder="Enter your First Name">
                        </div>
                        <div class="form-row">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" placeholder="Enter your Last Name">
                        </div>
                        <div class="form-row email">
                            <label for="email">Last Name</label>
                            <input type="email" id="email" name="email" placeholder="your@gmail.com">
                        </div>
                        <div class="form-row phone">
                            <label for="phone">Last Name</label>
                            <input type="tel" id="phone" name="phone" placeholder="+84 90 000 0000">
                        </div>
                        <div class="form-row password">
                            <label for="pass">Password</label>
                            <input type="password" id="pass" name="password" minlength="8" required class="pass-input"
                                placeholder="Enter your password" />
                            <span class="toggle-password" id="togglePassword">Show</span>
                        </div>
                        <div class="form-row password">
                            <label for="confirm-pass">Confirm Password</label>
                            <input type="password" id="confirm-pass" name="confirm-pass" minlength="8" required
                                placeholder="Confirm Password" class="pass-input" />
                            <span class="toggle-password" id="togglePassword">Show</span>
                        </div>
                    </div>
                    <div class="agree">
                        <input type="checkbox" name="" id="">
                        <label for="agree">I agree to the <a href="#">Terms of Service and Privacy Policy</a></label>
                    </div>
                    <div class="btn-login">CREATE ACCOUNT</div>
                    <div class="sign-up-inner">
                        <div class="sign-up">Already have an account?</div>
                        <a href="./login.html" class="sign-up-btn">Sign in</a>
                    </div>
                </div>
            </div>
            <div class="cover" style="background-image:url('./assets/images/bg-register.jpg')">
                <div class="box">
                    <div class="box-top">
                        <div class="img">
                            <img src="./assets/images/logo.svg" alt="">
                        </div>
                        <div class="title">
                            Your Private Sanctuary Awaits.
                        </div>

                    </div>
                    <div class="description">Discover exclusive beachfront residences with lagoon, golf, and ocean
                        views.</div>
                </div>
            </div>

        </div>
    </div>
    <!-- end header -->
    <main>

    </main>
    <!-- layout -->
    <!-- footer -->

    <!-- end footer -->
    <!-- end layout -->

    <script src="./assets/libs/jquery-3.7.1.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>
    <script src="./assets/libs/SplitText.min.js"></script>
    <script src="./assets/libs/bootstrap.bundle.min.js"></script>
    <script src="./assets/libs/swiper-bundle.min.js"></script>
    <script src="./assets/libs/moment.min.js"></script>
    <script src="./assets/libs/lightpick.min.js"></script>
    <script src="./assets/libs/glightbox.min.js"></script>
    <!-- import custom js -->
    <script type="module" src="./assets/main/js/script.min.js"></script>
    <script type="module" src="./assets/main/js/login.min.js"></script>
    <!-- <script type="module" src="./assets/main/js/home.min.js"></script> -->

    <!-- end import custom js -->
</body>

</html>
