<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoiana - Login</title>
    <!-- import favicon -->
    <link rel="icon" href="./assets/images/favicon.svg" />
    <!-- meta -->
    <meta property="og:url" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <!-- meta -->
    <link rel="stylesheet" href="./assets/fonts/Boska/font.css" />
    <link rel="stylesheet" href="./assets/fonts/Montserrat/font.css" />
    <link rel="stylesheet" href="./assets/libs/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/libs/lenis.css" />
    <link rel="stylesheet" href="./assets/libs/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./assets/libs/lightpick.min.css" />
    <link rel="stylesheet" href="./assets/libs/glightbox.min.css" />
    <!-- end meta -->
    <!-- link custom css page -->
    <link rel="stylesheet" href="./assets/main/css/style.min.css" />
    <!-- end link custom css page -->
    <!-- scrollRestoration -->
    <script>
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }
    </script>
</head>

<body>
    <!-- login -->
    <script>
        fetch("./components/login.html")
            .then((response) => response.text())
            .then((data) => {
                document.getElementById("login-screen").innerHTML = data;
            });
    </script>

    <div id="login-screen"></div>
    <!-- layout -->
    <!-- header -->
    <div class="login section-login">
        <div class="login-inner">
            <div class="cover" style="
            background-image: url(&quot;./assets/images/bg-login.webp&quot;);
          ">
                <div class="box">
                    <div class="box-top">
                        <div class="img">
                            <img src="./assets/images/logo.svg" alt="" />
                        </div>
                        <div class="title">Your Private Sanctuary Awaits.</div>
                    </div>

                </div>
            </div>
            <div class="login-wrapper" id="login">
                <div class="box-login">
                    <div class="title">Welcome back</div>
                    <div class="sub">Sign in to your Hoiana account</div>
                    <button class="btn-google-login" type="button" aria-label="Login to Google">
                        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.79 2.7v2.25h2.9c1.7-1.56 2.69-3.86 2.69-6.59Z" />
                            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.8.54-1.83.86-3.06.86-2.35 0-4.33-1.59-5.04-3.72H.96v2.33A9 9 0 0 0 9 18Z" />
                            <path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.16.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3-2.33Z" />
                            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.65 3.58 9 3.58Z" />
                        </svg>
                        <span>Login to Google</span>
                    </button>
                    <div class="login-divider" aria-hidden="true">
                        <span>OR</span>
                    </div>
                    <div class="box-form">
                        <div class="form-row">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" placeholder="Enter your username" />
                        </div>
                        <div class="form-row password">
                            <label for="pass">Password</label>
                            <input type="password" id="pass" name="password" minlength="8" required
                                placeholder="Enter your password" />
                            <span class="toggle-password" id="togglePassword">Show</span>
                        </div>
                    </div>
                    <div class="forgot-password">Forgot password?</div>
                    <div class="btn-login">Login</div>
                    <div class="sign-up-inner">
                        <div class="sign-up">Don't have an account?</div>
                        <a href="./register.html" class="sign-up-btn">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- end header -->
    <main></main>
    <!-- layout -->
    <!-- footer -->

    <!-- end footer -->
    <!-- end layout -->

    <script src="./assets/libs/jquery-3.7.1.js"></script>
    <script src="./assets/libs/lenis.min.js"></script>
    <script src="./assets/libs/gsap.min.js"></script>
    <script src="./assets/libs/ScrollTrigger.min.js"></script>
    <script src="./assets/libs/SplitText.min.js"></script>
    <script src="./assets/libs/bootstrap.bundle.min.js"></script>
    <script src="./assets/libs/swiper-bundle.min.js"></script>
    <script src="./assets/libs/moment.min.js"></script>
    <script src="./assets/libs/lightpick.min.js"></script>
    <script src="./assets/libs/glightbox.min.js"></script>
    <!-- import custom js -->
    <script type="module" src="./assets/main/js/script.min.js"></script>
    <script type="module" src="./assets/main/js/login.min.js"></script>
    <!-- <script type="module" src="./assets/main/js/home.min.js"></script> -->

    <!-- end import custom js -->
</body>

</html>
